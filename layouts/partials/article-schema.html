{{/* BlogPosting 结构化数据 —— 仅用于博客文章（SEO 优化 2026-11-22） */}}
{{ if eq .Section "blog" }}
{{ $desc := "" }}
{{ with .Description }}{{ $desc = . }}{{ else }}{{ with .Params.summary }}{{ $desc = . }}{{ end }}{{ end }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "headline": {{ .Title | jsonify | safeJS }},
  "description": {{ $desc | jsonify | safeJS }},
  "datePublished": {{ .Date.Format "2006-01-02T15:04:05Z07:00" | jsonify | safeJS }},
  "dateModified": {{ .Lastmod.Format "2006-01-02T15:04:05Z07:00" | jsonify | safeJS }},
  "author": {
    "@type": "Organization",
    "name": "Qingdao Quickleader International Trade Co., Ltd.",
    "url": {{ .Site.BaseURL | jsonify | safeJS }}
  },
  "publisher": {
    "@type": "Organization",
    "name": "Qingdao Quickleader",
    "logo": {
      "@type": "ImageObject",
      "url": {{ printf "%simg/logo/mark.webp" .Site.BaseURL | jsonify | safeJS }}
    }
  },
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": {{ .Permalink | jsonify | safeJS }}
  },
  "url": {{ .Permalink | jsonify | safeJS }},
  "inLanguage": {{ .Site.Language.Lang | jsonify | safeJS }}{{ with .Params.image }},
  "image": [{{ . | absURL | jsonify | safeJS }}]{{ end }}
}
</script>
{{ end }}
